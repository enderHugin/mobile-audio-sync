<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegir voz</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Cancion.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Canciones</a>
<span style="font-size: 13px; font-weight: 700; color: #BFAE97">Paso 5 de 6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #3A2C21"></span></div>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">¿Cómo es tu voz?</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #BFAE97">Escucha y quédate con la que te salga más cómoda. Puedes cambiarla luego.</p>
</div>

<div role="radiogroup" aria-label="Voces" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="5">
<div style="display: flex; gap: 8px">
<button type="button" role="radio" aria-checked="{{v.checked}}" onClick="{{v.pick}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 60px; box-sizing: border-box; text-align: left; border: 2px solid {{v.border}}; background: {{v.bg}}; border-radius: 16px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{v.dot}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{v.selected}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 50%; background: #3E8A3A"></span></sc-if></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 21px; font-weight: 800">{{v.name}}</span>
<span style="font-size: 13px; line-height: 18px; color: {{v.subColor}}; font-weight: {{v.subWeight}}">{{v.sub}}</span>
</span>
</button>
<button type="button" aria-label="Escuchar {{v.name}}" style="flex: none; width: 52px; border: 1px solid #3A2C21; border-radius: 16px; background: #1A130F; display: flex; align-items: center; justify-content: center; color: #E2B23C; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
</div>
</sc-for>
</div>

<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 48px; border: 1px dashed #6E5946; border-radius: 16px; background: transparent; font: 800 15px Nunito, sans-serif; color: #F4EADB; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>¿No lo sabes? Canta un poco y te ayudamos</button>

<a href="TusDatos.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Cantaré {{selLabel}}</a>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'melodia';
const data = [
{ id: 'melodia', name: 'La melodía', sub: 'La más fácil. Si dudas, esta', short: 'la melodía', strong: true },
{ id: 'aguda_m', name: 'Aguda de mujer', sub: 'Lo que en un coro llaman soprano', short: 'aguda de mujer', strong: false },
{ id: 'grave_m', name: 'Grave de mujer', sub: 'Contralto', short: 'grave de mujer', strong: false },
{ id: 'aguda_h', name: 'Aguda de hombre', sub: 'Tenor · hacen falta en tu lugar', short: 'aguda de hombre', strong: true },
{ id: 'grave_h', name: 'Grave de hombre', sub: 'Bajo', short: 'grave de hombre', strong: false }
];
const voices = data.map((v) => {
const on = v.id === sel;
return Object.assign({}, v, {
selected: on,
checked: String(on),
border: on ? '#3E8A3A' : '#3A2C21',
bg: on ? '#14231A' : '#1A130F',
dot: on ? '#3E8A3A' : '#6E5946',
subColor: v.strong ? '#7CC47A' : '#9C8B75',
subWeight: v.strong ? '700' : '400',
pick: () => this.setState({ sel: v.id })
});
});
const cur = data.filter((v) => v.id === sel)[0];
return { voices: voices, selLabel: cur.short };
}
}
DC.mount(Component);
</script>
</body>
</html>
