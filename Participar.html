<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paso 2: cómo vienes</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Lugar.html" aria-label="Atrás" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<span style="font-size: 14px; font-weight: 700; color: #BFAE97">Paso 2 de 5 · Cómo vienes</span>
</div>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #3A2C21"><div style="height: 3px; width: 40%; border-radius: 2px; background: #E2B23C"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">¿Cómo vienes?</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #BFAE97">Puedes elegir varias.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" aria-pressed="{{cantoPressed}}" onClick="{{toggleCanto}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{cantoBorder}}; background: {{cantoBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #3E8A3A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F4EADB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Cantar</span><span style="font-size: 14px; line-height: 20px; color: #BFAE97">No hace falta saber música</span></span>
<sc-if value="{{canto}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #3E8A3A; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4EADB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noCanto}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4D3B1C"></span></sc-if>
</button>

<button type="button" aria-pressed="{{oracionPressed}}" onClick="{{toggleOracion}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{oracionBorder}}; background: {{oracionBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #2D5FB8; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2C75C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2.6"/><path d="M12 2.5v2M12 13.5v2M5.5 9h2M16.5 9h2M7.4 4.4l1.4 1.4M15.2 12.2l1.4 1.4M7.4 13.6l1.4-1.4M15.2 5.8l1.4-1.4M12 15.5v4.5M9 21.5h6M10.3 18h3.4"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Orar</span><span style="font-size: 14px; line-height: 20px; color: #BFAE97">Ante el Santísimo, allí o desde casa</span></span>
<sc-if value="{{oracion}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #2D5FB8; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#F4EADB" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noOracion}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4D3B1C"></span></sc-if>
</button>

<button type="button" aria-pressed="{{aportePressed}}" onClick="{{toggleAporte}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{aporteBorder}}; background: {{aporteBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 42px; height: 42px; border-radius: 50%; background: #E07B24; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#120D0A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Aportar</span><span style="font-size: 14px; line-height: 20px; color: #BFAE97">Una vez o cada mes</span></span>
<sc-if value="{{aporte}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #E07B24; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#120D0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noAporte}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4D3B1C"></span></sc-if>
</button>
</div>

<div style="margin-top: auto">
<sc-if value="{{anySelected}}" hint-placeholder-val="{{ true }}">
<a href="{{next}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Continuar</a>
</sc-if>
<sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
<button type="button" disabled style="width: 100%; height: 56px; border: 1px solid #3A2C21; border-radius: 18px; background: #1A130F; color: #9C8B75; font: 800 17px Nunito, sans-serif">Elige al menos una</button>
</sc-if>
</div>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const canto = s.canto ?? true;
const oracion = s.oracion ?? true;
const aporte = s.aporte ?? false;
const any = canto || oracion || aporte;
const look = function (on, color, tint) { return { border: on ? color : '#3A2C21', bg: on ? tint : '#1A130F' }; };
const lc = look(canto, '#3E8A3A', '#14231A');
const lo = look(oracion, '#2D5FB8', '#121B2E');
const la = look(aporte, '#E07B24', '#2A1A0D');
return {
canto: canto, noCanto: !canto, oracion: oracion, noOracion: !oracion, aporte: aporte, noAporte: !aporte,
cantoPressed: String(canto), oracionPressed: String(oracion), aportePressed: String(aporte),
cantoBorder: lc.border, cantoBg: lc.bg, oracionBorder: lo.border, oracionBg: lo.bg, aporteBorder: la.border, aporteBg: la.bg,
anySelected: any, noneSelected: !any,
next: canto ? 'Cancion.html' : 'TusDatos.html',
toggleCanto: () => this.setState({ canto: !canto }),
toggleOracion: () => this.setState({ oracion: !oracion }),
toggleAporte: () => this.setState({ aporte: !aporte })
};
}
}
DC.mount(Component);
</script>
</body>
</html>
