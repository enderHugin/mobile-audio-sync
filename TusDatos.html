<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tus datos</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8C1C2B}a:hover{color:#6B1420}
input::placeholder{color:#7A6857}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#E9DFCC;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #FBF5EA; font-family: Nunito, system-ui, sans-serif; color: #2B1E16; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="TuVoz.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 700; color: #2B1E16; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Tu voz</a>
<span style="font-size: 13px; font-weight: 700; color: #6B5A4C">Paso 6 de 6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span></div>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 2px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">Último paso</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #5A4A3C">Para guardarte el sitio y avisarte antes del encuentro.</p>
</div>

<section aria-label="Lo que has elegido" style="display: flex; gap: 14px; align-items: center; padding: 14px 16px; background: #FFFDF8; border: 1px solid #E6D6BA; border-radius: 18px">
<svg width="60" height="60" viewBox="0 0 48 48" aria-hidden="true" style="flex: none"><circle cx="24" cy="24" r="23" fill="#2B1E16"/><g stroke="#2B1E16" stroke-width="1.5"><circle cx="24" cy="11" r="8" fill="#3E8A3A"/><circle cx="35.3" cy="17.5" r="8" fill="#23509E"/><circle cx="35.3" cy="30.5" r="8" fill="#3E8A3A"/><circle cx="24" cy="37" r="8" fill="#23509E"/><circle cx="12.7" cy="30.5" r="8" fill="#3E8A3A"/><circle cx="12.7" cy="17.5" r="8" fill="#23509E"/></g><circle cx="24" cy="24" r="6" fill="#E2B23C" stroke="#2B1E16" stroke-width="1.5"/></svg>
<div style="display: flex; flex-direction: column; gap: 3px; font-size: 14px; line-height: 20px">
<div><b>[FECHA 1]</b> · 21:00 tu hora</div>
<div><b>Camino del río</b></div>
<div>Cantas <b style="color: #2F6B2C">la melodía</b> y <b style="color: #23509E">oras</b></div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="datos-nombre" style="font-size: 14px; line-height: 18px; font-weight: 800">Tu nombre</label>
<input id="datos-nombre" type="text" defaultValue="Ana" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9B48F; border-radius: 14px; background: #FFFDF8; font: 16px Nunito, sans-serif; color: #2B1E16">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="datos-contacto" style="font-size: 14px; line-height: 18px; font-weight: 800">Correo o móvil</label>
<input id="datos-contacto" type="text" placeholder="Para avisarte del encuentro" style="height: 48px; box-sizing: border-box; padding: 0 14px; border: 1px solid #C9B48F; border-radius: 14px; background: #FFFDF8; font: 16px Nunito, sans-serif; color: #2B1E16">
</div>

<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: flex-start; gap: 10px">
<input id="datos-privacidad" type="checkbox" defaultChecked="{{ true }}" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #8C1C2B">
<label for="datos-privacidad" style="font-size: 14px; line-height: 20px; color: #3F3024">Acepto que guardéis mis datos para organizar el encuentro, sabiendo que es un acto religioso. <a href="#">Privacidad</a></label>
</div>
<div style="display: flex; align-items: flex-start; gap: 10px">
<input id="datos-edad" type="checkbox" defaultChecked="{{ true }}" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #8C1C2B">
<label for="datos-edad" style="font-size: 14px; line-height: 20px; color: #3F3024">Tengo [EDAD MÍNIMA] años o más, o vengo con mi familia</label>
</div>
</div>

<a href="MiEncuentro.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #8C1C2B; color: #FFF8EC; font-size: 17px; font-weight: 800; text-decoration: none">Apuntarme</a>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
return {};
}
}
DC.mount(Component);
</script>
</body>
</html>
