<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ensayar</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B1E16}a:hover{color:#5A4A3C}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#E9DFCC;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FBF5EA; font-family: Nunito, system-ui, sans-serif; color: #2B1E16; overflow: hidden">

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">Ensayar</h1>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #3E8A3A; color: #FFF8EC; font-size: 13px; line-height: 18px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>La melodía</span>
</div>

<div role="group" aria-label="Canción" style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; height: 40px; padding: 0 14px; border: none; border-radius: 999px; background: #2B1E16; color: #FFF8EC; font: 800 14px Nunito, sans-serif">1 · [Título]</button>
<button type="button" aria-pressed="false" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #C9B48F; border-radius: 999px; background: #FFFDF8; color: #2B1E16; font: 800 14px Nunito, sans-serif">2 · [Título 2]</button>
</div>

<section aria-label="Letra" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 20px 18px; background: #FFFDF8; border: 1px solid #E6D6BA; border-radius: 22px">
<p style="margin: 0; font-size: 17px; line-height: 24px; color: #8A735E">Primera línea de la letra</p>
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 27px; line-height: 34px; font-weight: 700; color: #A8957E"><span style="color: #2B1E16; background: linear-gradient(transparent 62%, #F6E2A8 62%)">Segunda línea, la que</span> cantas ahora</p>
<p style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; color: #5A4A3C">Tercera línea de la letra</p>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; font-weight: 700; color: #2F6B2C">
<span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: #3E8A3A"></span>
Ahora todos a la vez
</div>
</section>

<div aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: #E6D6BA"><div style="position: absolute; left: 0; top: 0; height: 6px; width: 32%; border-radius: 3px; background: #8C1C2B"></div></div>

<div style="display: flex; align-items: flex-start; justify-content: space-around">
<button type="button" aria-pressed="false" style="width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; font: 700 12px Nunito, sans-serif; color: #2B1E16"><span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C9B48F; background: #FFFDF8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>Más despacio</button>
<button type="button" aria-label="Pausar" style="width: 76px; height: 76px; border: none; border-radius: 50%; background: #8C1C2B; display: flex; align-items: center; justify-content: center; color: #FFF8EC"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg></button>
<button type="button" aria-pressed="false" style="width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; font: 700 12px Nunito, sans-serif; color: #2B1E16"><span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #C9B48F; background: #FFFDF8; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>Repetir parte</button>
</div>

<div role="group" aria-label="Qué se oye" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #EFE2CA; border-radius: 16px">
<button type="button" aria-pressed="{{guidePressed}}" onClick="{{setGuide}}" style="height: 44px; border: none; border-radius: 12px; background: {{guideBg}}; color: #2B1E16; font: 800 14px Nunito, sans-serif; cursor: pointer">Con mi voz de guía</button>
<button type="button" aria-pressed="{{musicPressed}}" onClick="{{setMusic}}" style="height: 44px; border: none; border-radius: 12px; background: {{musicBg}}; color: #2B1E16; font: 800 14px Nunito, sans-serif; cursor: pointer">Solo la música</button>
</div>
<p style="margin: -4px 0 0; font-size: 13px; line-height: 18px; color: #6B5A4C; text-align: center">{{tip}}</p>

</main>

<nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 76px; box-sizing: border-box; padding: 6px 8px 14px; background: #FFFDF8; border-top: 1px solid #E6D6BA">
<a href="Encuentros.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #6B5A4C; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Encuentros</a>
<a href="MiEncuentro.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #6B5A4C; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg>Mi encuentro</a>
<a href="Ensayar.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 800; color: #2F6B2C; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Ensayar</a>
</nav>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const guide = (this.state && this.state.guide) ?? true;
return {
guidePressed: String(guide),
musicPressed: String(!guide),
guideBg: guide ? '#FFFDF8' : 'transparent',
musicBg: guide ? 'transparent' : '#FFFDF8',
tip: guide ? 'Oyes tu voz cantando contigo. Síguela.' : 'Sin guía: así compruebas si ya te la sabes.',
setGuide: () => this.setState({ guide: true }),
setMusic: () => this.setState({ guide: false })
};
}
}
DC.mount(Component);
</script>
</body>
</html>
