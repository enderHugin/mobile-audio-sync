<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elegir canción</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Participar.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Cómo vienes</a>
<span style="font-size: 13px; font-weight: 700; color: #BFAE97">Paso 4 de 6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #E2B23C"></span><span style="height: 4px; border-radius: 2px; background: #3A2C21"></span><span style="height: 4px; border-radius: 2px; background: #3A2C21"></span></div>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">Las canciones</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #BFAE97">En este encuentro se cantan dos, en este orden. Escúchalas y marca las que vas a cantar.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="2">
<div style="display: flex; align-items: stretch; border: 2px solid {{s.border}}; background: {{s.bg}}; border-radius: 20px; overflow: hidden">
<div style="flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px 0 14px 14px">
<button type="button" aria-label="Escuchar {{s.title}}" style="width: 56px; height: 56px; border: none; border-radius: 50%; background: #E2B23C; display: flex; align-items: center; justify-content: center; color: #120D0A; cursor: pointer; box-shadow: 0 0 18px rgba(226,178,60,0.25)"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
<span style="font-size: 12px; line-height: 16px; font-weight: 700; color: #9C8B75">{{s.length}}</span>
</div>
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.toggle}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 14px; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 12px; line-height: 16px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: #E2B23C">{{s.order}}</span>
<span style="font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 24px; font-weight: 700">{{s.title}}</span>
<span style="font-size: 14px; line-height: 20px; color: #BFAE97">{{s.desc}}</span>
</span>
<sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #E2B23C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#120D0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid #6E5946"></span></sc-if>
</button>
</div>
</sc-for>
</div>

<div style="display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: #1A130F; border: 1px solid #3A2C21; border-radius: 16px; font-size: 14px; line-height: 20px; color: #D9CCB8">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
<span>Escúchalas un par de veces con auriculares. En el siguiente paso eliges tu voz, y vale para las dos.</span>
</div>

<a href="TuVoz.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Continuar</a>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const picked = s.picked || { a: true, b: true };
const data = [
{ id: 'a', order: 'Primera', title: '[Título de la canción]', desc: 'La que cantaremos todos a la vez', length: '3:45' },
{ id: 'b', order: 'Segunda', title: '[Título de la canción 2]', desc: 'Más sencilla, para cerrar juntos', length: '2:50' }
];
const songs = data.map((d) => {
const on = !!picked[d.id];
return Object.assign({}, d, {
on: on, off: !on, pressed: String(on),
border: on ? '#E2B23C' : '#3A2C21',
bg: on ? '#2A2110' : '#1A130F',
toggle: () => {
const next = Object.assign({}, picked);
next[d.id] = !on;
this.setState({ picked: next });
}
});
});
return { songs: songs };
}
}
DC.mount(Component);
</script>
</body>
</html>
