<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paso 3: canciones</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Participar.html" aria-label="Atrás" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<span style="font-size: 14px; font-weight: 700; color: #BFAE97">Paso 3 de 5 · Canciones</span>
</div>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #3A2C21"><div style="height: 3px; width: 60%; border-radius: 2px; background: #E2B23C"></div></div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; margin-top: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">Las canciones</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #BFAE97">Se cantan en este orden. Escúchalas y marca las tuyas.</p>
</div>

<ul style="margin: 0; padding: 0; list-style: none; background: #1A130F; border: 1px solid #3A2C21; border-radius: 18px; overflow: hidden">
<sc-for list="{{songs}}" as="s" hint-placeholder-count="2">
<li style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: {{s.divider}}">
<button type="button" aria-label="Escuchar {{s.title}}" style="flex: none; width: 44px; height: 44px; border: 1.5px solid #E2B23C; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: #E2B23C; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
<button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.toggle}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 21px; font-weight: 800">{{s.title}}</span><span style="font-size: 13px; line-height: 18px; color: #BFAE97">{{s.length}}</span></span>
<sc-if value="{{s.on}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 50%; background: #E2B23C; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#120D0A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{s.off}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid #4D3B1C"></span></sc-if>
</button>
</li>
</sc-for>
</ul>

<a href="TuVoz.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Continuar</a>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const picked = s.picked || { a: true, b: true };
const data = [
{ id: 'a', title: '1. [Título de la canción]', length: '3:45' },
{ id: 'b', title: '2. [Título de la canción 2]', length: '2:50' }
];
const songs = data.map((d, i) => {
const on = !!picked[d.id];
return Object.assign({}, d, {
on: on, off: !on, pressed: String(on),
divider: i === 0 ? 'none' : '1px solid #2A2019',
toggle: () => {
const next = Object.assign({}, picked);
next[d.id] = !on;
this.setState({ picked: next });
}
});
});
return { songs: songs };
}
}
DC.mount(Component);
</script>
</body>
</html>
