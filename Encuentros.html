<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Encuentros</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#E9C46A}a:hover{color:#F5D88E}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 900px; display: flex; flex-direction: column; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="position: relative; width: 390px; height: 330px; flex: none">
<img src="img/roseton-siguenza-portada.jpg" alt="Rosetón de una catedral con la luz atravesando el vidrio" style="display: block; width: 390px; height: 330px; object-fit: cover">
<header style="position: absolute; left: 20px; right: 20px; top: 14px; display: flex; align-items: center; justify-content: space-between; height: 44px">
<span style="font-family: Fraunces, Georgia, serif; font-size: 23px; font-weight: 700; color: #F4EADB">Una Voz</span>
<a href="MiEncuentro.html" style="display: flex; align-items: center; height: 44px; padding: 0 4px; font-size: 15px; font-weight: 800; text-decoration: none">Entrar</a>
</header>
</div>

<div style="flex: 1; box-sizing: border-box; margin-top: -34px; padding: 0 20px 20px; display: flex; flex-direction: column; gap: 12px; position: relative">

<p style="margin: 0; font-size: 15px; line-height: 22px; color: #BFAE97">Una canción, a la misma hora, en plazas de todo el mundo.</p>

<div style="display: flex; align-items: center; gap: 10px; margin-top: 6px">
<h2 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 24px; font-weight: 700">Próximos encuentros</h2>
<span aria-hidden="true" style="flex: 1; height: 1px; background: #4D3B1C"></span>
<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 3v18M6 9h12"/></svg>
</div>

<article style="display: flex; flex-direction: column; gap: 12px; padding: 16px; background: #3D0C14; border: 1px solid #6B1A28; border-radius: 22px">
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="padding: 4px 10px; border-radius: 999px; background: #E2B23C; color: #120D0A; font-size: 12px; line-height: 16px; font-weight: 800">Inscripción abierta</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 700; color: #E9C46A">[FECHA 1] · 21:00 tu hora</span>
</div>
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-family: Fraunces, Georgia, serif; font-size: 24px; line-height: 30px; font-weight: 700">Primer encuentro</div>
<div style="font-size: 14px; line-height: 20px; color: #E3CFC0">Canción: [Título de la canción]</div>
</div>
<div role="timer" aria-label="Faltan 12 días, 4 horas y 33 minutos" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; text-align: center">
<div style="padding: 6px 0; background: #240709; border-radius: 12px"><div style="font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 30px; font-weight: 700; color: #F2C75C; font-variant-numeric: tabular-nums">12</div><div style="font-size: 12px; line-height: 16px; color: #D8BFB3">días</div></div>
<div style="padding: 6px 0; background: #240709; border-radius: 12px"><div style="font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 30px; font-weight: 700; color: #F2C75C; font-variant-numeric: tabular-nums">04</div><div style="font-size: 12px; line-height: 16px; color: #D8BFB3">horas</div></div>
<div style="padding: 6px 0; background: #240709; border-radius: 12px"><div style="font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 30px; font-weight: 700; color: #F2C75C; font-variant-numeric: tabular-nums">33</div><div style="font-size: 12px; line-height: 16px; color: #D8BFB3">min</div></div>
<div style="padding: 6px 0; background: #240709; border-radius: 12px"><div style="font-family: Fraunces, Georgia, serif; font-size: 26px; line-height: 30px; font-weight: 700; color: #F2C75C; font-variant-numeric: tabular-nums">08</div><div style="font-size: 12px; line-height: 16px; color: #D8BFB3">seg</div></div>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="flex: 1; min-width: 0; font-size: 13px; line-height: 18px; color: #D8BFB3">[N] lugares<br>[N] personas</span>
<a href="Lugares.html" style="flex: none; white-space: nowrap; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px; border-radius: 14px; background: #E2B23C; color: #120D0A; font-size: 15px; font-weight: 800; text-decoration: none">Elegir mi lugar<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
</div>
</article>

<article style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: #1A130F; border: 1px solid #3A2C21; border-radius: 20px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; line-height: 18px; font-weight: 700; color: #BFAE97">[FECHA 2] · 21:00 tu hora</div>
<div style="font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 26px; font-weight: 700">Segundo encuentro</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 14px; line-height: 20px; font-weight: 800; color: #E9C46A"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>Faltan 47 días</div>
</div>
<a href="Lugares.html" style="flex: none; display: flex; align-items: center; height: 44px; padding: 0 14px; border: 1.5px solid #E2B23C; border-radius: 14px; font-size: 14px; font-weight: 800; text-decoration: none">Ver lugares</a>
</article>

<article style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: transparent; border: 1.5px dashed #3A2C21; border-radius: 20px">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; line-height: 18px; font-weight: 700; color: #9C8B75">[FECHA 3]</div>
<div style="font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 26px; font-weight: 700; color: #D9CCB8">Tercer encuentro</div>
<div style="font-size: 14px; line-height: 20px; color: #9C8B75">Preparando la canción</div>
</div>
<button type="button" style="flex: none; display: flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 1px solid #3A2C21; border-radius: 14px; background: #241A14; font: 800 14px Nunito, sans-serif; color: #F4EADB"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>Avísame</button>
</article>

<p style="margin: 2px 0 0; font-size: 11px; line-height: 16px; color: #8C7B66">Foto: catedral de Sigüenza · EventusBonus, CC BY-SA 4.0</p>

</div>
</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
return {};
}
}
DC.mount(Component);
</script>
