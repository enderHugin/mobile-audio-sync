<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sacerdotes: ofrecerse</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
input::placeholder{color:#9C8B75}
</style>
<style>html,body{margin:0}body{display:flex;justify-content:center;background:#070504;min-height:100vh}#app{flex:none}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<a href="Participar.html" style="align-self: flex-start; display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Volver</a>

<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">Para sacerdotes</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #BFAE97">Elige el lugar y lo que puedes ofrecer ese día.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sac-lugar" style="font-size: 14px; line-height: 18px; font-weight: 800">Lugar</label>
<select id="sac-lugar" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 1px solid #4D3B1C; border-radius: 14px; background: #241A14; font: 16px Nunito, sans-serif; color: #F4EADB; color-scheme: dark">
<option>Camino del río · Primer encuentro</option>
<option>Plaza del Mercado · Primer encuentro</option>
<option>Plaza de la Fuente · Primer encuentro</option>
</select>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" role="switch" aria-checked="{{expoChecked}}" onClick="{{toggleExpo}}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border: 2px solid {{expoBorder}}; background: {{expoBg}}; border-radius: 16px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #2A2110; border: 1px solid #4D3B1C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2.6"/><path d="M12 2.5v2M12 13.5v2M5.5 9h2M16.5 9h2M7.4 4.4l1.4 1.4M15.2 12.2l1.4 1.4M7.4 13.6l1.4-1.4M15.2 5.8l1.4-1.4M12 15.5v4.5M9 21.5h6M10.3 18h3.4"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 21px; font-weight: 800">Exponer el Santísimo</span><span style="font-size: 13px; line-height: 18px; color: #BFAE97">Durante el encuentro</span></span>
<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 26px; border-radius: 999px; background: {{expoTrack}}"><span style="position: absolute; top: 3px; left: {{expoKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #F4EADB"></span></span>
</button>
<button type="button" role="switch" aria-checked="{{confChecked}}" onClick="{{toggleConf}}" style="display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px; text-align: left; border: 2px solid {{confBorder}}; background: {{confBg}}; border-radius: 16px; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #2A2110; border: 1px solid #4D3B1C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h8"/><path d="M8 3c0 6-.8 12-2.6 18H9.6L11 12"/><path d="M16 3c0 6 .8 12 2.6 18h-4.2L13 12"/><path d="M7.4 16.5v3M5.9 18h3M16.6 16.5v3M15.1 18h3"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 16px; line-height: 21px; font-weight: 800">Confesar</span><span style="font-size: 13px; line-height: 18px; color: #BFAE97">{{confNote}}</span></span>
<span aria-hidden="true" style="flex: none; position: relative; width: 44px; height: 26px; border-radius: 999px; background: {{confTrack}}"><span style="position: absolute; top: 3px; left: {{confKnob}}; width: 20px; height: 20px; border-radius: 50%; background: #F4EADB"></span></span>
</button>
</div>

<sc-if value="{{conf}}" hint-placeholder-val="{{ true }}">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sac-desde" style="font-size: 13px; line-height: 18px; font-weight: 800">Desde</label>
<input id="sac-desde" type="time" defaultValue="20:00" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #4D3B1C; border-radius: 14px; background: #241A14; font: 16px Nunito, sans-serif; color: #F4EADB; color-scheme: dark">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sac-hasta" style="font-size: 13px; line-height: 18px; font-weight: 800">Hasta</label>
<input id="sac-hasta" type="time" defaultValue="20:55" style="height: 44px; box-sizing: border-box; padding: 0 12px; border: 1px solid #4D3B1C; border-radius: 14px; background: #241A14; font: 16px Nunito, sans-serif; color: #F4EADB; color-scheme: dark">
</div>
</div>
</sc-if>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="sac-nombre" style="font-size: 14px; line-height: 18px; font-weight: 800">Nombre y parroquia</label>
<input id="sac-nombre" type="text" placeholder="P. Nombre · Parroquia, diócesis" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #4D3B1C; border-radius: 14px; background: #241A14; font: 16px Nunito, sans-serif; color: #F4EADB">
</div>

<p style="margin: 0; display: flex; gap: 8px; font-size: 13px; line-height: 19px; color: #BFAE97"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#E2B23C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Confirmamos cada ofrecimiento con la parroquia antes de mostrarlo en el lugar.</p>

<button type="button" style="margin-top: auto; height: 56px; border: none; border-radius: 18px; background: #E2B23C; color: #120D0A; font: 800 17px Nunito, sans-serif; cursor: pointer">Ofrecerme</button>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const expo = s.expo ?? true;
const conf = s.conf ?? true;
return {
conf: conf,
expoChecked: String(expo), confChecked: String(conf),
expoBorder: expo ? '#E2B23C' : '#3A2C21', expoBg: expo ? '#2A2110' : '#1A130F',
confBorder: conf ? '#E2B23C' : '#3A2C21', confBg: conf ? '#2A2110' : '#1A130F',
expoTrack: expo ? '#E2B23C' : '#3A2C21', expoKnob: expo ? '21px' : '3px',
confTrack: conf ? '#E2B23C' : '#3A2C21', confKnob: conf ? '21px' : '3px',
confNote: conf ? 'Antes de empezar, en el mismo lugar' : 'No confesaré ese día',
toggleExpo: () => this.setState({ expo: !expo }),
toggleConf: () => this.setState({ conf: !conf })
};
}
}
DC.mount(Component);
</script>
</body>
</html>
