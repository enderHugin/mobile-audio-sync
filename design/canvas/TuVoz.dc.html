<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Paso 4: tu voz</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Cancion.dc.html" aria-label="Atrás" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<span style="font-size: 14px; font-weight: 700; color: #BFAE97">Paso 4 de 5 · Tu voz</span>
</div>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #3A2C21"><div style="height: 3px; width: 80%; border-radius: 2px; background: #E2B23C"></div></div>
</div>

<h1 style="margin: 4px 0 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">¿Cómo es tu voz?</h1>

<ul role="radiogroup" aria-label="Voces" style="margin: 0; padding: 0; list-style: none; background: #1A130F; border: 1px solid #3A2C21; border-radius: 18px; overflow: hidden">
<sc-for list="{{voices}}" as="v" hint-placeholder-count="5">
<li style="display: flex; align-items: center; gap: 8px; padding: 6px 10px 6px 14px; border-top: {{v.divider}}">
<button type="button" role="radio" aria-checked="{{v.checked}}" onClick="{{v.pick}}" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0; border: none; background: transparent; text-align: left; font-family: Nunito, sans-serif; color: #F4EADB; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{v.dot}}; display: flex; align-items: center; justify-content: center"><sc-if value="{{v.selected}}" hint-placeholder-val="{{ false }}"><span style="width: 10px; height: 10px; border-radius: 50%; background: #E2B23C"></span></sc-if></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="font-size: 16px; line-height: 21px; font-weight: 800">{{v.name}}</span>
<sc-if value="{{v.hasSub}}" hint-placeholder-val="{{ false }}"><span style="font-size: 13px; line-height: 18px; color: #BFAE97">{{v.sub}}</span></sc-if>
</span>
</button>
<button type="button" aria-label="Escuchar {{v.name}}" style="flex: none; width: 44px; height: 44px; border: none; border-radius: 50%; background: transparent; display: flex; align-items: center; justify-content: center; color: #E2B23C; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4l13 8-13 8z"/></svg></button>
</li>
</sc-for>
</ul>

<button type="button" style="align-self: flex-start; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0; border: none; background: transparent; font: 800 15px Nunito, sans-serif; color: #E9C46A; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/></svg>No lo sé, ayúdame</button>

<a href="TusDatos.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Continuar</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const sel = (this.state && this.state.sel) || 'melodia';
const data = [
{ id: 'melodia', name: 'La melodía', sub: 'La más fácil' },
{ id: 'aguda_m', name: 'Aguda de mujer', sub: '' },
{ id: 'grave_m', name: 'Grave de mujer', sub: '' },
{ id: 'aguda_h', name: 'Aguda de hombre', sub: '' },
{ id: 'grave_h', name: 'Grave de hombre', sub: '' }
];
const voices = data.map((v, i) => {
const on = v.id === sel;
return Object.assign({}, v, {
selected: on,
checked: String(on),
hasSub: v.sub !== '',
dot: on ? '#E2B23C' : '#4D3B1C',
divider: i === 0 ? 'none' : '1px solid #2A2019',
pick: () => this.setState({ sel: v.id })
});
});
return { voices: voices };
}
}
</script>
</body>
</html>
