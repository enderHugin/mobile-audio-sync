<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Proponer un lugar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
input::placeholder{color:#9C8B75}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; height: 44px">
<a href="Lugares.dc.html" aria-label="Atrás" style="width: 44px; height: 44px; margin-left: -12px; display: flex; align-items: center; justify-content: center; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a>
<span style="font-size: 14px; font-weight: 700; color: #BFAE97">Paso 1 de 5 · Lugar</span>
</div>
<div aria-hidden="true" style="height: 3px; border-radius: 2px; background: #3A2C21"><div style="height: 3px; width: 20%; border-radius: 2px; background: #E2B23C"></div></div>
</div>

<h1 style="margin: 4px 0 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">Proponer un lugar</h1>

<div role="group" aria-label="Tipo de lugar" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #241A14; border-radius: 16px">
<button type="button" aria-pressed="{{plazaPressed}}" onClick="{{setPlaza}}" style="height: 42px; border: none; border-radius: 12px; background: {{plazaBg}}; color: {{plazaFg}}; font: 800 15px Nunito, sans-serif; cursor: pointer">Plaza</button>
<button type="button" aria-pressed="{{caminoPressed}}" onClick="{{setCamino}}" style="height: 42px; border: none; border-radius: 12px; background: {{caminoBg}}; color: {{caminoFg}}; font: 800 15px Nunito, sans-serif; cursor: pointer">Camino</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<p style="margin: 0; font-size: 14px; line-height: 20px; color: #BFAE97">{{hint}}</p>
<div style="position: relative; width: 350px; height: 240px; flex: none; border-radius: 20px; overflow: hidden; border: 1px solid #3A2C21">
<svg width="350" height="240" viewBox="0 20 350 240" aria-hidden="true" style="position: absolute; left: 0; top: 0"><rect y="0" width="350" height="280" fill="#1E1712"/><path d="M-10 52 C 80 30, 160 70, 360 38" fill="none" stroke="#1B3352" stroke-width="24"/><rect x="250" y="182" width="90" height="86" rx="14" fill="#1C2A17"/><g stroke="#3A2D22" stroke-width="12" stroke-linecap="round" fill="none"><path d="M-10 112 H360"/><path d="M-10 208 H240"/><path d="M95 -10 V290"/><path d="M215 -10 V290"/><path d="M-10 268 L240 182"/></g><rect x="111" y="124" width="92" height="72" rx="10" fill="#2E241C" stroke="#4A3A2B" stroke-width="2"/></svg>
<sc-if value="{{camino}}" hint-placeholder-val="{{ true }}">
<svg width="350" height="240" viewBox="0 20 350 240" aria-hidden="true" style="position: absolute; left: 0; top: 0"><path d="M40 208 H215 V112 H310" fill="none" stroke="#E2B23C" stroke-width="5" stroke-dasharray="1 9" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div aria-hidden="true" style="position: absolute; left: 26px; top: 174px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #0F0B08; border: 2.5px solid #E2B23C"></div>
<div aria-hidden="true" style="position: absolute; left: 296px; top: 78px; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; background: #E2B23C"></div>
</sc-if>
<sc-if value="{{plaza}}" hint-placeholder-val="{{ false }}">
<div aria-hidden="true" style="position: absolute; left: 139px; top: 122px; width: 36px; height: 36px; box-sizing: border-box; border-radius: 50%; background: #E2B23C; box-shadow: 0 0 0 8px rgba(226,178,60,0.18)"></div>
</sc-if>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="prop-nombre" style="font-size: 14px; line-height: 18px; font-weight: 800">Nombre</label>
<input id="prop-nombre" type="text" placeholder="{{placeholder}}" style="height: 46px; box-sizing: border-box; padding: 0 14px; border: 1px solid #3A2C21; border-radius: 14px; background: #1A130F; font: 16px Nunito, sans-serif; color: #F4EADB">
</div>

<div style="display: flex; align-items: flex-start; gap: 10px">
<input id="prop-sacerdote" type="checkbox" style="flex: none; width: 22px; height: 22px; margin: 0; accent-color: #E2B23C">
<label for="prop-sacerdote" style="font-size: 14px; line-height: 20px; color: #D9CCB8">Conozco a un sacerdote que puede exponer el Santísimo aquí</label>
</div>

<a href="Lugar.dc.html" style="margin-top: auto; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #E2B23C; color: #120D0A; font-size: 17px; font-weight: 800; text-decoration: none">Proponer</a>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const tipo = (this.state && this.state.tipo) || 'camino';
const camino = tipo === 'camino';
return {
camino: camino,
plaza: !camino,
caminoPressed: String(camino),
plazaPressed: String(!camino),
caminoBg: camino ? '#E2B23C' : 'transparent',
caminoFg: camino ? '#120D0A' : '#F4EADB',
plazaBg: camino ? 'transparent' : '#E2B23C',
plazaFg: camino ? '#F4EADB' : '#120D0A',
hint: camino ? 'Toca el mapa donde empieza y donde acaba.' : 'Toca el mapa donde está la plaza.',
placeholder: camino ? 'Ej.: Del puente a la iglesia' : 'Ej.: Plaza de la Fuente',
setCamino: () => this.setState({ tipo: 'camino' }),
setPlaza: () => this.setState({ tipo: 'plaza' })
};
}
}
</script>
</body>
</html>
