<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ensayar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 16px">

<div style="display: flex; align-items: baseline; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 34px; font-weight: 700">Ensayar</h1>
<span style="font-size: 14px; font-weight: 700; color: #BFAE97">La melodía</span>
</div>

<div role="group" aria-label="Canción" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #241A14; border-radius: 16px">
<button type="button" aria-pressed="true" style="height: 40px; border: none; border-radius: 12px; background: #3A2C21; color: #F4EADB; font: 800 14px Nunito, sans-serif">1. [Título]</button>
<button type="button" aria-pressed="false" style="height: 40px; border: none; border-radius: 12px; background: transparent; color: #BFAE97; font: 800 14px Nunito, sans-serif">2. [Título 2]</button>
</div>

<section aria-label="Letra" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 18px; padding: 0 4px">
<p style="margin: 0; font-size: 18px; line-height: 25px; color: #6E5E4E">Primera línea de la letra</p>
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 35px; font-weight: 700; color: #8C7B66"><span style="color: #FFF6E6">Segunda línea, la que</span> cantas ahora</p>
<p style="margin: 0; font-size: 20px; line-height: 27px; font-weight: 600; color: #BFAE97">Tercera línea de la letra</p>
</section>

<div style="display: flex; flex-direction: column; gap: 6px">
<div aria-hidden="true" style="height: 4px; border-radius: 2px; background: #3A2C21"><div style="height: 4px; width: 32%; border-radius: 2px; background: #E2B23C"></div></div>
<div style="display: flex; justify-content: space-between; font-size: 12px; line-height: 16px; color: #9C8B75; font-variant-numeric: tabular-nums"><span>1:12</span><span>3:45</span></div>
</div>

<div style="display: flex; align-items: center; justify-content: space-between">
<button type="button" aria-label="Más despacio" aria-pressed="false" style="width: 72px; height: 44px; border: none; border-radius: 12px; background: transparent; font: 800 15px Nunito, sans-serif; color: #BFAE97">0,75×</button>
<button type="button" aria-label="Pausar" style="width: 72px; height: 72px; border: none; border-radius: 50%; background: #E2B23C; display: flex; align-items: center; justify-content: center; color: #120D0A"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg></button>
<button type="button" role="switch" aria-checked="{{guideChecked}}" aria-label="Voz de guía" onClick="{{toggleGuide}}" style="width: 72px; height: 44px; border: none; border-radius: 12px; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: 800 12px Nunito, sans-serif; color: {{guideColor}}; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>{{guideLabel}}</button>
</div>

</main>

<nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 76px; box-sizing: border-box; padding: 6px 8px 14px; background: #150F0B; border-top: 1px solid #3A2C21">
<a href="Encuentros.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #9C8B75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Encuentros</a>
<a href="MiEncuentro.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #9C8B75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Mi encuentro</a>
<a href="Ensayar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 800; color: #E2B23C; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Ensayar</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const guide = (this.state && this.state.guide) ?? true;
return {
guideChecked: String(guide),
guideColor: guide ? '#E2B23C' : '#9C8B75',
guideLabel: guide ? 'Guía sí' : 'Guía no',
toggleGuide: () => this.setState({ guide: !guide })
};
}
}
</script>
</body>
</html>
