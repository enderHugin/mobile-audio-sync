<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ensayar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F4EADB}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0F0B08; font-family: Nunito, system-ui, sans-serif; color: #F4EADB; overflow: hidden">

<main style="flex: 1; min-height: 0; box-sizing: border-box; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px">

<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">Ensayar</h1>
<span style="display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #14231A; border: 1px solid #3E8A3A; color: #7CC47A; font-size: 13px; line-height: 18px; font-weight: 800"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>La melodía</span>
</div>

<div role="group" aria-label="Canción" style="display: flex; gap: 8px; overflow-x: auto">
<button type="button" aria-pressed="true" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #E2B23C; border-radius: 999px; background: #2A2110; color: #E9C46A; font: 800 14px Nunito, sans-serif">1 · [Título]</button>
<button type="button" aria-pressed="false" style="flex: none; height: 40px; padding: 0 14px; border: 1px solid #3A2C21; border-radius: 999px; background: #1A130F; color: #F4EADB; font: 800 14px Nunito, sans-serif">2 · [Título 2]</button>
</div>

<section aria-label="Letra" style="flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 20px 18px; background: #1A130F; border: 1px solid #4D3B1C; border-radius: 22px">
<p style="margin: 0; font-size: 17px; line-height: 24px; color: #8C7B66">Primera línea de la letra</p>
<p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 27px; line-height: 34px; font-weight: 700; color: #8C7B66"><span style="color: #FFF6E6; background: linear-gradient(transparent 66%, rgba(226,178,60,0.38) 66%)">Segunda línea, la que</span> cantas ahora</p>
<p style="margin: 0; font-size: 19px; line-height: 26px; font-weight: 600; color: #D9CCB8">Tercera línea de la letra</p>
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; line-height: 20px; font-weight: 700; color: #7CC47A">
<span aria-hidden="true" style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: #3E8A3A"></span>
Ahora todos a la vez
</div>
</section>

<div aria-hidden="true" style="position: relative; height: 6px; border-radius: 3px; background: #3A2C21"><div style="position: absolute; left: 0; top: 0; height: 6px; width: 32%; border-radius: 3px; background: #E2B23C"></div></div>

<div style="display: flex; align-items: flex-start; justify-content: space-around">
<button type="button" aria-pressed="false" style="width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; font: 700 12px Nunito, sans-serif; color: #D9CCB8"><span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #4D3B1C; background: #1A130F; display: flex; align-items: center; justify-content: center; color: #F4EADB"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg></span>Más despacio</button>
<button type="button" aria-label="Pausar" style="width: 76px; height: 76px; border: none; border-radius: 50%; background: #E2B23C; display: flex; align-items: center; justify-content: center; color: #120D0A; box-shadow: 0 0 24px rgba(226,178,60,0.3)"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg></button>
<button type="button" aria-pressed="false" style="width: 84px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: none; background: transparent; font: 700 12px Nunito, sans-serif; color: #D9CCB8"><span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #4D3B1C; background: #1A130F; display: flex; align-items: center; justify-content: center; color: #F4EADB"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></span>Repetir parte</button>
</div>

<div role="group" aria-label="Qué se oye" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #241A14; border: 1px solid #3A2C21; border-radius: 16px">
<button type="button" aria-pressed="{{guidePressed}}" onClick="{{setGuide}}" style="height: 44px; border: none; border-radius: 12px; background: {{guideBg}}; color: {{guideFg}}; font: 800 14px Nunito, sans-serif; cursor: pointer">Con mi voz de guía</button>
<button type="button" aria-pressed="{{musicPressed}}" onClick="{{setMusic}}" style="height: 44px; border: none; border-radius: 12px; background: {{musicBg}}; color: {{musicFg}}; font: 800 14px Nunito, sans-serif; cursor: pointer">Solo la música</button>
</div>
<p style="margin: -4px 0 0; font-size: 13px; line-height: 18px; color: #9C8B75; text-align: center">{{tip}}</p>

</main>

<nav aria-label="Principal" style="flex: none; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); height: 76px; box-sizing: border-box; padding: 6px 8px 14px; background: #150F0B; border-top: 1px solid #3A2C21">
<a href="Encuentros.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #9C8B75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>Encuentros</a>
<a href="MiEncuentro.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 700; color: #9C8B75; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Mi encuentro</a>
<a href="Ensayar.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 800; color: #E2B23C; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Ensayar</a>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const guide = (this.state && this.state.guide) ?? true;
return {
guidePressed: String(guide),
musicPressed: String(!guide),
guideBg: guide ? '#E2B23C' : 'transparent',
guideFg: guide ? '#120D0A' : '#F4EADB',
musicBg: guide ? 'transparent' : '#E2B23C',
musicFg: guide ? '#F4EADB' : '#120D0A',
tip: guide ? 'Oyes tu voz cantando contigo. Síguela.' : 'Sin guía: así compruebas si ya te la sabes.',
setGuide: () => this.setState({ guide: true }),
setMusic: () => this.setState({ guide: false })
};
}
}
</script>
</body>
</html>
