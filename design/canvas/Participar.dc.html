<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>¿Cómo vienes?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500..800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B1E16}a:hover{color:#5A4A3C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 12px; background: #FBF5EA; font-family: Nunito, system-ui, sans-serif; color: #2B1E16; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Lugar.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 700; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Camino del río</a>
<span style="font-size: 13px; font-weight: 700; color: #6B5A4C">Paso 3 de 6</span>
</div>
<div aria-hidden="true" style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px"><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #8C1C2B"></span><span style="height: 5px; border-radius: 3px; background: #E6D6BA"></span><span style="height: 5px; border-radius: 3px; background: #E6D6BA"></span><span style="height: 5px; border-radius: 3px; background: #E6D6BA"></span></div>

<div style="display: flex; flex-direction: column; gap: 4px; margin-top: 4px">
<h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 30px; line-height: 36px; font-weight: 700">¿Cómo vienes?</h1>
<p style="margin: 0; font-size: 15px; line-height: 21px; color: #5A4A3C">Elige una o varias. Tu rosetón se colorea con lo que elijas.</p>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0">
<svg width="104" height="104" viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="23" fill="#2B1E16"/><g stroke="#2B1E16" stroke-width="1.5"><circle cx="24" cy="11" r="8" fill="{{p0}}"/><circle cx="35.3" cy="17.5" r="8" fill="{{p1}}"/><circle cx="35.3" cy="30.5" r="8" fill="{{p2}}"/><circle cx="24" cy="37" r="8" fill="{{p3}}"/><circle cx="12.7" cy="30.5" r="8" fill="{{p4}}"/><circle cx="12.7" cy="17.5" r="8" fill="{{p5}}"/></g><circle cx="24" cy="24" r="6" fill="#E2B23C" stroke="#2B1E16" stroke-width="1.5"/></svg>
<div aria-live="polite" style="font-family: Fraunces, Georgia, serif; font-size: 19px; line-height: 24px; font-weight: 700">{{label}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" aria-pressed="{{cantoPressed}}" onClick="{{toggleCanto}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{cantoBorder}}; background: {{cantoBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #2B1E16; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #3E8A3A; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFF8EC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Vengo a cantar</span><span style="font-size: 14px; line-height: 20px; color: #5A4A3C">Aunque nunca hayas cantado</span></span>
<sc-if value="{{canto}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #3E8A3A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF8EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noCanto}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid #B59E78"></span></sc-if>
</button>

<button type="button" aria-pressed="{{oracionPressed}}" onClick="{{toggleOracion}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{oracionBorder}}; background: {{oracionBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #2B1E16; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #23509E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#F2C75C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="2.6"/><path d="M12 2.5v2M12 13.5v2M5.5 9h2M16.5 9h2M7.4 4.4l1.4 1.4M15.2 12.2l1.4 1.4M7.4 13.6l1.4-1.4M15.2 5.8l1.4-1.4M12 15.5v4.5M9 21.5h6M10.3 18h3.4"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Vengo a orar</span><span style="font-size: 14px; line-height: 20px; color: #5A4A3C">Ante el Santísimo, aquí o desde casa</span></span>
<sc-if value="{{oracion}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #23509E; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF8EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noOracion}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid #B59E78"></span></sc-if>
</button>

<button type="button" aria-pressed="{{aportePressed}}" onClick="{{toggleAporte}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{aporteBorder}}; background: {{aporteBg}}; border-radius: 18px; font-family: Nunito, sans-serif; color: #2B1E16; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 50%; background: #E07B24; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2B1E16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; line-height: 22px; font-weight: 800">Quiero aportar</span><span style="font-size: 14px; line-height: 20px; color: #5A4A3C">Para que llegue a más plazas</span></span>
<sc-if value="{{aporte}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #E07B24; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2B1E16" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noAporte}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; box-sizing: border-box; border-radius: 50%; border: 2px solid #B59E78"></span></sc-if>
</button>
</div>

<div style="margin-top: auto">
<sc-if value="{{anySelected}}" hint-placeholder-val="{{ true }}">
<a href="{{next}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 18px; background: #8C1C2B; color: #FFF8EC; font-size: 17px; font-weight: 800; text-decoration: none">Continuar</a>
</sc-if>
<sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
<button type="button" disabled style="width: 100%; height: 56px; border: none; border-radius: 18px; background: #E6D6BA; color: #5A4A3C; font: 800 17px Nunito, sans-serif">Elige al menos una</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const canto = s.canto ?? true;
const oracion = s.oracion ?? true;
const aporte = s.aporte ?? false;
const colors = [];
const names = [];
if (canto) { colors.push('#3E8A3A'); names.push('cantar'); }
if (oracion) { colors.push('#23509E'); names.push('orar'); }
if (aporte) { colors.push('#E07B24'); names.push('aportar'); }
const petal = function (i) { return colors.length ? colors[i % colors.length] : '#D9C7A6'; };
let label = 'Elige cómo vienes';
if (names.length === 1) label = 'Vienes a ' + names[0];
if (names.length === 2) label = 'Vienes a ' + names[0] + ' y ' + names[1];
if (names.length === 3) label = 'Vienes a cantar, orar y aportar';
const look = function (on, color, tint) { return { border: on ? color : '#E6D6BA', bg: on ? tint : '#FFFDF8' }; };
const lc = look(canto, '#3E8A3A', '#EEF5E6');
const lo = look(oracion, '#23509E', '#E9EEF8');
const la = look(aporte, '#E07B24', '#FDEEDF');
return {
p0: petal(0), p1: petal(1), p2: petal(2), p3: petal(3), p4: petal(4), p5: petal(5),
label: label,
canto: canto, noCanto: !canto, oracion: oracion, noOracion: !oracion, aporte: aporte, noAporte: !aporte,
cantoPressed: String(canto), oracionPressed: String(oracion), aportePressed: String(aporte),
cantoBorder: lc.border, cantoBg: lc.bg, oracionBorder: lo.border, oracionBg: lo.bg, aporteBorder: la.border, aporteBg: la.bg,
anySelected: colors.length > 0, noneSelected: colors.length === 0,
next: canto ? 'Cancion.dc.html' : 'TusDatos.dc.html',
toggleCanto: () => this.setState({ canto: !canto }),
toggleOracion: () => this.setState({ oracion: !oracion }),
toggleAporte: () => this.setState({ aporte: !aporte })
};
}
}
</script>
</body>
</html>
