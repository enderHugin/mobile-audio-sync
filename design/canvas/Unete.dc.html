<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Únete: elige cómo apoyar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#111827}a:hover{color:#374151}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 18px; background: #F5F6F8; font-family: Inter, system-ui, sans-serif; color: #111827; overflow: hidden">

<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<a href="Inicio.dc.html" style="display: flex; align-items: center; gap: 4px; height: 44px; padding-right: 8px; font-size: 15px; font-weight: 600; text-decoration: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>Volver</a>
<span style="font-size: 14px; font-weight: 600; color: #4B5563">Paso 1 de 2</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', Inter, sans-serif; font-size: 28px; line-height: 34px; font-weight: 700; letter-spacing: -0.01em">¿Cómo quieres participar?</h1>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #4B5563">Puedes elegir varias. Tu color se forma con lo que elijas y puedes cambiarlo cuando quieras.</p>
</div>

<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0">
<div aria-hidden="true" style="width: 112px; height: 112px; border-radius: 50%; background: {{ring}}; display: flex; align-items: center; justify-content: center">
<div style="width: 82px; height: 82px; border-radius: 50%; background: #F5F6F8; display: flex; align-items: center; justify-content: center; gap: 4px">
<sc-if value="{{canto}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></sc-if>
<sc-if value="{{oracion}}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></sc-if>
<sc-if value="{{aporte}}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></sc-if>
</div>
</div>
<div aria-live="polite" style="font-size: 16px; line-height: 22px; font-weight: 700">{{label}}</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<button type="button" aria-pressed="{{cantoPressed}}" onClick="{{toggleCanto}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{cantoBorder}}; background: {{cantoBg}}; border-radius: 16px; font-family: Inter, sans-serif; color: #111827; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #ECFDF3; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#15803D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; line-height: 22px; font-weight: 700">Cantar</span><span style="font-size: 14px; line-height: 20px; color: #4B5563">Elige una voz, ensáyala y canta en tu plaza</span></span>
<sc-if value="{{canto}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 8px; background: #16A34A; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noCanto}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid #9CA3AF"></span></sc-if>
</button>

<button type="button" aria-pressed="{{oracionPressed}}" onClick="{{toggleOracion}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{oracionBorder}}; background: {{oracionBg}}; border-radius: 16px; font-family: Inter, sans-serif; color: #111827; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #EEF2FF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; line-height: 22px; font-weight: 700">Orar</span><span style="font-size: 14px; line-height: 20px; color: #4B5563">Acompaña a la hora del evento o en un turno</span></span>
<sc-if value="{{oracion}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 8px; background: #1D4ED8; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noOracion}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid #9CA3AF"></span></sc-if>
</button>

<button type="button" aria-pressed="{{aportePressed}}" onClick="{{toggleAporte}}" style="display: flex; align-items: center; gap: 14px; width: 100%; padding: 14px 16px; text-align: left; border: 2px solid {{aporteBorder}}; background: {{aporteBg}}; border-radius: 16px; font-family: Inter, sans-serif; color: #111827; cursor: pointer">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 50%; background: #FFF4EA; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C2410C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 16px; line-height: 22px; font-weight: 700">Aportar</span><span style="font-size: 14px; line-height: 20px; color: #4B5563">Sostén el proyecto, una vez o cada mes</span></span>
<sc-if value="{{aporte}}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; border-radius: 8px; background: #FB923C; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#111827" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></sc-if>
<sc-if value="{{noAporte}}" hint-placeholder-val="{{ true }}"><span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 8px; border: 2px solid #9CA3AF"></span></sc-if>
</button>
</div>

<div style="margin-top: auto">
<sc-if value="{{anySelected}}" hint-placeholder-val="{{ true }}">
<a href="Registro.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 16px; background: #111827; color: #FFFFFF; font-size: 17px; font-weight: 700; text-decoration: none">Continuar</a>
</sc-if>
<sc-if value="{{noneSelected}}" hint-placeholder-val="{{ false }}">
<button type="button" disabled style="width: 100%; height: 56px; border: none; border-radius: 16px; background: #D9DDE3; color: #4B5563; font: 700 17px Inter, sans-serif">Elige al menos una</button>
</sc-if>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const canto = s.canto ?? true;
const oracion = s.oracion ?? true;
const aporte = s.aporte ?? false;
const roles = [];
if (canto) roles.push({ c: '#16A34A', n: 'canto' });
if (oracion) roles.push({ c: '#1D4ED8', n: 'oración' });
if (aporte) roles.push({ c: '#FB923C', n: 'aportación' });
let ring = '#D9DDE3';
if (roles.length === 1) {
ring = roles[0].c;
} else if (roles.length > 1) {
const seg = 100 / roles.length;
const gap = 1;
const parts = ['transparent 0 ' + gap + '%'];
roles.forEach(function (r, i) {
parts.push(r.c + ' 0 ' + ((i + 1) * seg - gap).toFixed(2) + '%');
parts.push('transparent 0 ' + (i < roles.length - 1 ? ((i + 1) * seg + gap).toFixed(2) : '100') + '%');
});
ring = 'conic-gradient(' + parts.join(', ') + ')';
}
const cap = function (t) { return t.charAt(0).toUpperCase() + t.slice(1); };
const names = roles.map(function (r) { return r.n; });
let label = 'Elige al menos una forma';
if (names.length === 1) label = cap(names[0]);
if (names.length === 2) label = cap(names[0]) + ' y ' + names[1];
if (names.length === 3) label = 'Canto, oración y aportación';
const look = function (on, color, tint) {
return { border: on ? color : '#E3E6EB', bg: on ? tint : '#FFFFFF' };
};
const lc = look(canto, '#16A34A', '#ECFDF3');
const lo = look(oracion, '#1D4ED8', '#EEF2FF');
const la = look(aporte, '#FB923C', '#FFF4EA');
return {
ring: ring,
label: label,
canto: canto, noCanto: !canto,
oracion: oracion, noOracion: !oracion,
aporte: aporte, noAporte: !aporte,
cantoPressed: String(canto), oracionPressed: String(oracion), aportePressed: String(aporte),
cantoBorder: lc.border, cantoBg: lc.bg,
oracionBorder: lo.border, oracionBg: lo.bg,
aporteBorder: la.border, aporteBg: la.bg,
anySelected: roles.length > 0,
noneSelected: roles.length === 0,
toggleCanto: () => this.setState({ canto: !canto }),
toggleOracion: () => this.setState({ oracion: !oracion }),
toggleAporte: () => this.setState({ aporte: !aporte })
};
}
}
</script>
</body>
</html>
